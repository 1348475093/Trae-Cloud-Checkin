
name: Trae Work Cloud Checkin

on:
  schedule:
    # GitHub 使用 UTC 时间
    # 北京时间 09:17
    - cron: "17 1 * * *"
    # 北京时间 13:17
    - cron: "17 5 * * *"
    # 北京时间 20:17
    - cron: "17 12 * * *"

  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trae-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: Daily Checkin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify configuration
        env:
          TRAE_SESSION: ${{ secrets.TRAE_SESSION }}
        run: |
          if [ -z "$TRAE_SESSION" ]; then
            echo "::error::TRAE_SESSION is missing"
            exit 1
          fi
          echo "Configuration found"

      - name: Run Trae Work Checkin
        env:
          TRAE_SESSION: ${{ secrets.TRAE_SESSION }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
        run: python checkin.py

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Trae Work checkin failed"
          echo "Check the logs and update Secrets if expired"
          exit 1
